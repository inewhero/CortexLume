name: Publish verified Linux release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.3.9)
        required: true
        type: string
      run_id:
        description: Successful Linux CI run for the tagged commit
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-linux-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      CI_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify successful Linux CI matches the release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft == false' | grep -qx true
          tag_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID" > run.json
          jq -e --arg sha "$tag_sha" '
            .head_sha == $sha and
            .path == ".github/workflows/linux-ci.yml" and
            .event == "push" and
            .status == "completed" and
            .conclusion == "success"
          ' run.json
      - name: Download the tested portable package
        run: gh run download "$CI_RUN_ID" --name CortexLume-linux-x64-baseline --dir release
      - name: Build Debian package from the verified portable runtime
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          asset="CortexLume-$version-linux-x64-portable.zip"
          test -f "release/$asset"
          mkdir -p .tmp/linux-portable
          unzip -q "release/$asset" -d .tmp/linux-portable
          sh scripts/package-linux-deb.sh .tmp/linux-portable/CortexLume-linux-x64 "$version" release
          dpkg-deb --info "release/CortexLume-$version-linux-amd64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: CortexLume-linux-deb
          path: release/*.deb
          if-no-files-found: error

  verify:
    name: Debian install and runtime (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: CortexLume-linux-deb
          path: release
      - name: Install and inspect the Debian package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y desktop-file-utils ./release/*.deb
          set -x
          test "$(dpkg-query -W -f='${Version}' cortexlume)" = "${RELEASE_TAG#v}"
          test "$(readlink -f /usr/bin/cortexlume)" = /opt/CortexLume/CortexLume
          test -x /opt/CortexLume/resources/cortexlume-science/cortexlume-science
          desktop-file-validate /usr/share/applications/org.cortexlume.CortexLume.desktop
          if find /opt/CortexLume -xtype l -print -quit | grep -q .; then
            echo 'Installed application contains a broken symbolic link' >&2
            exit 1
          fi
      - name: Test installed planning, exports, screenshots and GUI
        run: |
          xvfb-run -a pnpm smoke:packaged:mcp /opt/CortexLume/CortexLume
          xvfb-run -a pnpm smoke:packaged:mcp-screenshot /opt/CortexLume/CortexLume
      - name: Verify package removal
        run: |
          sudo apt-get purge -y cortexlume
          test ! -e /opt/CortexLume
          test ! -L /usr/bin/cortexlume
          test ! -e /usr/share/applications/org.cortexlume.CortexLume.desktop
          test ! -L /etc/apparmor.d/cortexlume

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      CI_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: CortexLume-linux-deb
          path: release
      - name: Download the verified portable ZIP
        run: gh run download "$CI_RUN_ID" --name CortexLume-linux-x64-baseline --dir release
      - name: Publish Linux packages and checksums
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          zip="CortexLume-$version-linux-x64-portable.zip"
          deb="CortexLume-$version-linux-amd64.deb"
          checksum="CortexLume-$version-linux-x64-SHA256SUMS.txt"
          cd release
          sha256sum "$zip" "$deb" > "$checksum"
          gh release upload "$RELEASE_TAG" "$zip" "$deb" "$checksum"
