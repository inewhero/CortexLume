name: Windows CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert single product version source
        run: pnpm version:check

      - name: Assert release tag matches product version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Release tag '${{ github.ref_name }}' does not match the root product version ('$expectedTag')."
          }

      - name: Generate science build metadata
        run: pnpm version:metadata

      - name: Create Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e "./services/science[dev]"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build science sidecar
        if: github.event_name != 'pull_request'
        run: pnpm science:build

      - name: Prepare Squirrel toolchain
        if: github.event_name != 'pull_request'
        run: pnpm --dir node_modules/electron-winstaller run install

      - name: Build Windows packages
        if: github.event_name != 'pull_request'
        run: pnpm --filter @cortexlume/desktop make

      - name: Verify installed Windows application
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          $setup = Get-ChildItem `
            "apps/desktop/out/make/squirrel.windows/x64" `
            -Filter "*Setup.exe" |
            Select-Object -First 1
          if (-not $setup) {
            throw "Expected Squirrel Setup was not generated."
          }
          ./scripts/verify-squirrel-install.ps1 `
            -SetupPath $setup.FullName `
            -Version $version

      - name: Package optional example dataset
        if: github.event_name != 'pull_request'
        run: pnpm examples:package

      - name: Collect release files
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release | Out-Null

          $setup = Get-ChildItem `
            "apps/desktop/out/make/squirrel.windows/x64" `
            -Filter "*Setup.exe" |
            Select-Object -First 1

          $portable = Get-ChildItem `
            "apps/desktop/out/make/zip/win32/x64" `
            -Filter "*.zip" |
            Select-Object -First 1

          if (-not $setup -or -not $portable) {
            throw "Expected Windows packages were not generated."
          }

          Copy-Item $setup.FullName `
            "release/CortexLume-$version-win-x64-Setup.exe"

          Copy-Item $portable.FullName `
            "release/CortexLume-$version-win-x64-portable.zip"

      - name: Sign Windows installer (optional secret-gated Authenticode)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          CORTEXLUME_CODESIGN_PFX_B64: ${{ secrets.CORTEXLUME_CODESIGN_PFX_B64 }}
          CORTEXLUME_CODESIGN_PASSWORD: ${{ secrets.CORTEXLUME_CODESIGN_PASSWORD }}
          CORTEXLUME_CODESIGN_TIMESTAMP_URL: ${{ secrets.CORTEXLUME_CODESIGN_TIMESTAMP_URL }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($env:CORTEXLUME_CODESIGN_PFX_B64) -or [string]::IsNullOrWhiteSpace($env:CORTEXLUME_CODESIGN_PASSWORD)) {
            Write-Host "Authenticode signing skipped: signing secrets are not configured (expected for ordinary forks)."
            exit 0
          }
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if (-not $signtool) {
            throw "Authenticode signing was requested, but signtool.exe is unavailable on the runner."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "cortexlume-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CORTEXLUME_CODESIGN_PFX_B64))
            $timestamp = if ([string]::IsNullOrWhiteSpace($env:CORTEXLUME_CODESIGN_TIMESTAMP_URL)) { "http://timestamp.digicert.com" } else { $env:CORTEXLUME_CODESIGN_TIMESTAMP_URL }
            $password = ConvertTo-SecureString $env:CORTEXLUME_CODESIGN_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (-not $certificate) { throw "The configured Authenticode certificate could not be imported." }
            & $signtool.Source sign /fd SHA256 /f $pfxPath /p $env:CORTEXLUME_CODESIGN_PASSWORD /tr $timestamp /td SHA256 "release\CortexLume-$version-win-x64-Setup.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed to sign the Windows installer." }
            & $signtool.Source verify /pa /all "release\CortexLume-$version-win-x64-Setup.exe"
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for the Windows installer." }
            "Authenticode: Valid" | Set-Content -Path "release\AUTHENTICODE.txt" -Encoding utf8
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Generate release checksums and SPDX SBOM
        if: github.event_name != 'pull_request'
        run: pnpm release:metadata

      - name: Verify release checksums and SPDX SBOM
        if: github.event_name != 'pull_request'
        run: pnpm release:verify

      - name: Upload workflow artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: CortexLume-Windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Attest release artifacts
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v8
        with:
          name: CortexLume-Windows-x64
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/* \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --generate-notes
