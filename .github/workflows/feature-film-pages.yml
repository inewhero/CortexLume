name: Feature film player

on:
  push:
    branches: [main]
    paths:
      - 'media/**'
      - '.github/workflows/feature-film-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feature-film-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: media
      - name: Publish video player
        id: deployment
        uses: actions/deploy-pages@v4
